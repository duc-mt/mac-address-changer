name: 🐍 CI

on:
  pull_request:
  push:
    branches: [master, main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ⤵️ Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check --select F,E9,B,SIM,RUF .

  test:
    name: ⤵️ Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  security:
    name: ⤵️ Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # -ll: report/fail on medium severity and above only. The
      # remaining Low findings (subprocess usage, non-cryptographic
      # `random` for a MAC address) are inherent to what this tool is
      # - it exists specifically to run subprocess commands, and MAC
      # randomization isn't a secret that needs a CSPRNG - not real
      # vulnerabilities to silence one-by-one with #nosec comments.
      - run: bandit -r main.py -ll
